<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My JavaScript Platformer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #2b2b2b;
        }

        h1 {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }

        #gameCanvas {
            display: block;
            background: grey;
        }
    </style>
</head>

<body>
    <h1>My Platformer</h1>
    <canvas id="gameCanvas"></canvas>

    <script src="game.js?v=1"></script>
</body>
</html>
